<div class="auth-page"> <div class="auth-container">
  <div class="auth-card">
    <div class="logo">
      <i class="fas fa-dumbbell"></i>
      <h1>LiftLog</h1>
    </div>
    <h2>Fiók létrehozása</h2>

    <form [formGroup]="registerForm" (ngSubmit)="onRegister()">

      <div class="input-group">
        <label for="reg_name">Teljes név</label>
        <input type="text" formControlName="name" id="reg_name" placeholder="Kovács János">
      </div>

      <div class="input-group">
        <label for="reg_email">E-mail cím</label>
        <input type="email" formControlName="email" id="reg_email" placeholder="pelda@email.hu">
      </div>

      <div class="input-group">
        <label for="reg_password">Jelszó</label>
        <input type="password" formControlName="password" id="reg_password" placeholder="******">
      </div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="registerForm.invalid">
        Regisztráció
      </button>

      <p *ngIf="errorMessage" class="error-text" style="color: red; text-align: center; margin-top: 10px;">
        {{ errorMessage }}
      </p>
    </form>

    <p class="auth-footer">
      Van már fiókod? <a routerLink="/login">Jelentkezz be</a>
    </p>
  </div>
</div>
</div>
