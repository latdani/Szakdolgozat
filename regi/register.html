<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiftLog - Regisztráció</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-page">
<div class="auth-container">
    <div class="auth-card">
        <div class="logo">
            <i class="fas fa-dumbbell"></i>
            <h1>LiftLog</h1>
        </div>
        <h2>Fiók létrehozása</h2>
        <form id="registerFormPage">
            <div class="input-group">
                <label for="reg_name">Teljes név</label>
                <input type="text" id="reg_name" required placeholder="Kovács János">
            </div>
            <div class="input-group">
                <label for="reg_email">E-mail cím</label>
                <input type="email" id="reg_email" required placeholder="pelda@email.hu">
            </div>
            <div class="input-group">
                <label for="reg_password">Jelszó</label>
                <input type="password" id="reg_password" required placeholder="******">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Regisztráció</button>
        </form>
        <p class="auth-footer">
            Van már fiókod? <a href="login.html">Jelentkezz be</a>
        </p>
    </div>
</div>
<script src="js/register.js"></script>
</body>
</html>
