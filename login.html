<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiftLog - Bejelentkezés</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
<div class="auth-container">
  <div class="auth-card">
    <div class="logo">
      <i class="fas fa-dumbbell"></i>
      <h1>LiftLog</h1>
    </div>
    <h2>Bejelentkezés</h2>
    <form id="loginFormPage">
      <div class="input-group">
        <label for="login_email">E-mail cím</label>
        <input type="email" id="login_email" required placeholder="pelda@email.hu">
      </div>
      <div class="input-group">
        <label for="login_password">Jelszó</label>
        <input type="password" id="login_password" required placeholder="******">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Belépés</button>
    </form>
    <p class="auth-footer">
      Nincs még fiókod? <a href="register.html">Regisztráció</a>
    </p>
  </div>
</div>
<script src="js/login.js"></script>
</body>
</html>
